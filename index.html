<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131f">
  <title>Pulse / interacción luminosa</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --night: #07131f;
      --deep: #0b2030;
      --ink: #d9f4ef;
      --muted: #83a3a8;
      --mint: #88f3cc;
      --aqua: #61dce7;
      --coral: #ff8d79;
      --line: rgba(155, 238, 220, .18);
      --button-x: 50%;
      --button-y: 50%;
      --pulse-size: 1;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--night);
      font-family: 'DM Sans', sans-serif;
    }

    body::before,
    body::after {
      position: fixed;
      content: '';
      pointer-events: none;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .48;
    }

    body::before {
      width: 58vw;
      height: 58vw;
      top: -27vw;
      right: -16vw;
      background: radial-gradient(circle, rgba(57, 191, 201, .22), transparent 68%);
    }

    body::after {
      width: 48vw;
      height: 48vw;
      bottom: -27vw;
      left: -15vw;
      background: radial-gradient(circle, rgba(255, 125, 99, .13), transparent 70%);
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100svh;
      isolation: isolate;
      place-items: center;
      padding: 28px;
      background:
        linear-gradient(rgba(7, 19, 31, .48), rgba(7, 19, 31, .48)),
        linear-gradient(115deg, transparent 0 49.8%, rgba(137, 243, 204, .05) 50%, transparent 50.2%),
        linear-gradient(25deg, transparent 0 49.8%, rgba(97, 220, 231, .035) 50%, transparent 50.2%);
      background-size: auto, 92px 92px, 137px 137px;
    }

    .scene::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: '';
      background: radial-gradient(ellipse at center, transparent 20%, rgba(3, 11, 18, .58) 100%);
      pointer-events: none;
    }

    .start-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 6;
      display: grid;
      gap: 18px;
      justify-items: center;
      max-width: 450px;
      text-align: center;
      transform: translate(-50%, -50%);
      transition: opacity .35s ease, visibility .35s ease;
    }

    .start-screen::before,
    .start-screen::after {
      position: absolute;
      z-index: -1;
      content: '';
      pointer-events: none;
    }

    .start-screen::before {
      inset: -50vh -50vw;
      background-image:
        radial-gradient(circle at 12% 24%, rgba(255, 255, 255, .9) 0 1px, transparent 1.5px),
        radial-gradient(circle at 72% 15%, rgba(136, 243, 204, .85) 0 1px, transparent 1.5px),
        radial-gradient(circle at 84% 78%, rgba(255, 255, 255, .8) 0 1.5px, transparent 2px),
        radial-gradient(circle at 26% 82%, rgba(97, 220, 231, .7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 48% 42%, rgba(255, 255, 255, .72) 0 1px, transparent 1.5px);
      background-size: 173px 149px, 227px 191px, 263px 239px, 311px 283px, 389px 347px;
      opacity: .62;
      animation: star-drift 18s linear infinite;
    }

    .start-screen::after {
      width: 460px;
      height: 460px;
      border: 1px solid rgba(136, 243, 204, .16);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(97, 220, 231, .12), transparent 63%);
      box-shadow: 0 0 90px rgba(97, 220, 231, .14), inset 0 0 55px rgba(136, 243, 204, .08);
      transform: rotate(-25deg) scaleX(1.45);
      animation: orbit-glow 7s ease-in-out infinite;
    }

    .start-kicker {
      margin: 0;
      color: var(--coral);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .start-title {
      margin: 0;
      color: #e9fffb;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3.4rem, 9vw, 6rem);
      font-weight: 600;
      letter-spacing: -.06em;
      line-height: .9;
      text-shadow: 0 0 18px rgba(136, 243, 204, .38), 0 0 55px rgba(97, 220, 231, .24);
      animation: aim-reveal 1.1s cubic-bezier(.2, .8, .2, 1) both, aim-breathe 4s 1.1s ease-in-out infinite;
    }

    .start-copy {
      max-width: 330px;
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .start-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .start-button {
      position: relative;
      overflow: hidden;
      min-width: 150px;
      min-height: 54px;
      padding: 0 25px;
      cursor: pointer;
      color: #06202a;
      border: 0;
      border-radius: 10px;
      background: var(--mint);
      box-shadow: 0 8px 0 rgba(40, 155, 145, .35), 0 14px 24px rgba(0, 0, 0, .2);
      font: 700 .78rem 'Space Grotesk', sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: transform .2s ease, filter .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .start-button::before {
      position: absolute;
      top: 0;
      left: -80%;
      width: 55%;
      height: 100%;
      content: '';
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .42), transparent);
      transform: skewX(-20deg);
    }

    .start-button:hover {
      filter: brightness(1.08);
      box-shadow: 0 8px 0 rgba(40, 155, 145, .35), 0 16px 28px rgba(0, 0, 0, .25);
      transform: translateY(-2px);
    }

    .start-button:active { transform: translateY(5px) scale(.98); box-shadow: 0 3px 0 rgba(40, 155, 145, .35), 0 7px 14px rgba(0, 0, 0, .18); }

    .start-button.is-launching {
      cursor: wait;
      animation: launch-start 2.5s ease-in-out both;
    }

    .start-button.is-launching::before { animation: launch-shimmer 1.1s linear infinite; }

    .start-button:disabled { opacity: 1; }

    .start-button:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 5px;
    }

    .info-button {
      display: inline-grid;
      place-items: center;
      color: var(--ink);
      background: rgba(217, 244, 239, .1);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .2) inset, 0 8px 18px rgba(0, 0, 0, .18);
      text-decoration: none;
    }

    .info-button:hover { color: #06202a; background: var(--aqua); }

    .scene.is-game-active .start-screen {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .scene:not(.is-game-active) .interaction-zone,
    .scene:not(.is-game-active) .counter,
    .scene:not(.is-game-active) .game-timer {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .speed-control {
      position: absolute;
      top: 25px;
      right: clamp(22px, 5vw, 76px);
      z-index: 8;
      display: grid;
      gap: 8px;
      justify-items: end;
      transition: opacity .3s ease;
    }

    .scene.is-game-active .speed-control { opacity: 0; pointer-events: none; }

    .size-control {
      position: absolute;
      top: 91px;
      right: clamp(22px, 5vw, 76px);
      z-index: 8;
      display: grid;
      gap: 8px;
      justify-items: end;
      transition: opacity .3s ease;
    }

    .scene.is-game-active .size-control { opacity: 0; pointer-events: none; }

    .speed-label {
      color: var(--muted);
      font-size: .65rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .speed-options {
      display: flex;
      gap: 5px;
      padding: 5px;
      border: 1px solid rgba(155, 238, 220, .22);
      border-radius: 10px;
      background: rgba(10, 31, 46, .82);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .16);
    }

    .speed-option {
      width: 30px;
      height: 30px;
      padding: 0;
      cursor: pointer;
      color: var(--muted);
      border: 0;
      border-radius: 6px;
      background: transparent;
      box-shadow: none;
      font: 600 .75rem 'Space Grotesk', sans-serif;
      transition: color .2s ease, background .2s ease, transform .2s ease;
    }

    .speed-option:hover {
      color: var(--ink);
      background: rgba(136, 243, 204, .16);
    }

    .speed-option[aria-pressed='true'] {
      color: #06202a;
      background: var(--mint);
      box-shadow: 0 0 0 2px rgba(136, 243, 204, .18);
    }

    .speed-option:active { transform: scale(.92); }

    .speed-option:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: 3px;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 26px clamp(22px, 5vw, 76px);
    }

    .brand {
      display: flex;
      gap: 11px;
      align-items: center;
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border: 2px solid var(--mint);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(136, 243, 204, .08), 0 0 18px var(--mint);
    }

    .status {
      display: flex;
      gap: 9px;
      align-items: center;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .status strong { color: var(--ink); font-weight: 600; }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--mint);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--mint);
      animation: breathe 2.4s ease-in-out infinite;
    }

    .intro {
      position: absolute;
      top: clamp(108px, 15vh, 155px);
      left: clamp(22px, 9vw, 140px);
      max-width: 430px;
      animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
    }

    .eyebrow {
      margin: 0 0 17px;
      color: var(--coral);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 400px;
      margin: 0;
      color: #e9fffb;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.65rem, 6vw, 5.7rem);
      font-weight: 600;
      letter-spacing: -.055em;
      line-height: .95;
    }

    .intro-copy {
      max-width: 340px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(.94rem, 1.5vw, 1.05rem);
      line-height: 1.65;
    }

    .interaction-zone {
      position: relative;
      width: min(86vw, 980px);
      height: min(68vh, 640px);
      min-height: 380px;
      margin-top: 0;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(10, 31, 46, .18);
      box-shadow: inset 0 0 80px rgba(101, 230, 214, .025), 0 24px 80px rgba(0, 0, 0, .12);
      animation: rise 1s .12s cubic-bezier(.2, .8, .2, 1) both;
    }

    .interaction-zone::before,
    .interaction-zone::after {
      position: absolute;
      content: '';
      pointer-events: none;
    }

    .interaction-zone::before {
      inset: 10px;
      border: 1px dashed rgba(155, 238, 220, .11);
      border-radius: 15px;
    }

    .interaction-zone::after {
      top: 50%;
      left: 50%;
      width: 1px;
      height: calc(100% - 48px);
      background: linear-gradient(transparent, rgba(136, 243, 204, .16), transparent);
      transform: translate(-50%, -50%);
    }

    .zone-label {
      position: absolute;
      right: 25px;
      bottom: 20px;
      color: rgba(155, 238, 220, .42);
      font-size: .67rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .pulse-button {
      position: absolute;
      top: var(--button-y);
      left: var(--button-x);
      display: grid;
      width: calc(122px * var(--pulse-size));
      height: calc(122px * var(--pulse-size));
      padding: 0;
      cursor: pointer;
      color: #06202a;
      border: 0;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 10px rgba(136, 243, 204, .1), 0 12px 24px rgba(0, 0, 0, .25);
      transform: translate(-50%, -50%);
      transition: top .5s cubic-bezier(.2, .8, .2, 1), left .5s cubic-bezier(.2, .8, .2, 1), box-shadow .3s ease, filter .3s ease, transform .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .pulse-button.is-hidden { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.5); }

    .approach-ring {
      position: absolute;
      inset: -50%;
      border: 3px solid var(--coral);
      border-radius: 50%;
      box-shadow: 0 0 22px rgba(255, 141, 121, .58), inset 0 0 18px rgba(255, 141, 121, .16);
      pointer-events: none;
      transform: scale(1);
      opacity: 1;
    }

    .approach-ring.is-closing { animation: ring-close var(--round-duration) linear forwards; }

    .approach-ring.is-missed { opacity: 0; transform: scale(.5); }

    .pulse-button::before {
      position: absolute;
      inset: 7px;
      content: '';
      border: 1px solid rgba(4, 51, 56, .18);
      border-radius: 50%;
    }

    .pulse-button::after {
      position: absolute;
      inset: -18px;
      content: '';
      border: 1px solid rgba(136, 243, 204, .16);
      border-radius: 50%;
      transition: inset .35s ease, opacity .35s ease;
    }

    .pulse-button:hover {
      filter: saturate(1.12) brightness(1.06);
      box-shadow: 0 0 0 13px rgba(136, 243, 204, .14), 0 16px 28px rgba(0, 0, 0, .28);
      transform: translate(-50%, -50%) scale(1.045);
    }

    .pulse-button:hover::after { inset: -26px; opacity: .72; }

    .pulse-button:active,
    .pulse-button.is-pressed {
      transform: translate(-50%, -50%) scale(.91);
      transition: transform .09s ease;
    }

    .pulse-button.is-ready {
      animation: ready-cue var(--cue-duration) ease-in-out both;
    }

    .pulse-button:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 7px;
    }

    .button-content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 5px;
      place-items: center;
    }

    .button-icon { font-size: 1.3rem; line-height: 1; }

    .button-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .counter {
      position: absolute;
      right: clamp(24px, 8vw, 120px);
      bottom: clamp(85px, 12vh, 125px);
      display: grid;
      gap: 5px;
      text-align: right;
      animation: rise .9s .3s cubic-bezier(.2, .8, .2, 1) both;
    }

    .counter-value {
      color: var(--mint);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.15rem;
      line-height: 1;
    }

    .counter-label {
      color: var(--muted);
      font-size: .7rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .game-timer {
      position: absolute;
      top: 28px;
      left: clamp(22px, 5vw, 76px);
      z-index: 5;
      display: grid;
      gap: 4px;
      transition: opacity .3s ease, visibility .3s ease;
    }

    .game-timer-value {
      color: var(--mint);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.55rem;
      line-height: 1;
    }

    .game-timer-label {
      color: var(--muted);
      font-size: .63rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .game-message {
      position: absolute;
      top: clamp(108px, 15vh, 155px);
      right: clamp(22px, 9vw, 140px);
      display: grid;
      gap: 7px;
      text-align: right;
    }

    .game-message strong { color: var(--mint); font-family: 'Space Grotesk', sans-serif; font-size: 1.55rem; }
    .game-message span { color: var(--muted); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; }

    .score-pop {
      position: absolute;
      z-index: 4;
      color: var(--mint);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: score-pop .72s ease-out both;
    }

    .score-pop.miss { color: var(--coral); }

    .game-over { filter: grayscale(.45); }

    .hint {
      position: absolute;
      bottom: 29px;
      left: 50%;
      display: flex;
      gap: 8px;
      align-items: center;
      color: rgba(217, 244, 239, .55);
      font-size: .75rem;
      transform: translateX(-50%);
      animation: fade-in 1s .7s both;
    }

    .hint-key {
      display: inline-grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border: 1px solid rgba(217, 244, 239, .28);
      border-radius: 5px;
      font-size: .65rem;
    }

    .interaction-zone.is-moving .pulse-button { box-shadow: 0 0 0 1px rgba(204, 255, 237, .85), 0 0 0 20px rgba(136, 243, 204, .1), 0 0 82px rgba(104, 240, 212, .75), 0 18px 34px rgba(0, 0, 0, .28); }

    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .5; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes ring-close { from { transform: scale(1); } to { transform: scale(.5); } }
    @keyframes ready-cue {
      0%, 100% { opacity: .78; filter: brightness(1); box-shadow: 0 0 0 1px rgba(204, 255, 237, .72), 0 0 0 12px rgba(136, 243, 204, .08), 0 0 45px rgba(104, 240, 212, .5), 0 18px 34px rgba(0, 0, 0, .28); }
      50% { opacity: 1; filter: brightness(1.28) saturate(1.2); box-shadow: 0 0 0 1px rgba(255, 255, 255, .96), 0 0 0 25px rgba(136, 243, 204, .2), 0 0 90px rgba(104, 240, 212, .95), 0 18px 34px rgba(0, 0, 0, .28); }
    }
    @keyframes launch-start {
      0%, 100% { filter: brightness(1); transform: scale(1); box-shadow: 0 8px 0 rgba(40, 155, 145, .35), 0 14px 24px rgba(0, 0, 0, .2); }
      35% { filter: brightness(1.2) saturate(1.12); transform: scale(1.06); box-shadow: 0 0 0 12px rgba(136, 243, 204, .16), 0 0 36px rgba(136, 243, 204, .7); }
      70% { filter: brightness(1.08); transform: scale(.98); box-shadow: 0 5px 0 rgba(40, 155, 145, .35), 0 10px 18px rgba(0, 0, 0, .18); }
    }
    @keyframes launch-shimmer { from { left: -80%; } to { left: 140%; } }
    @keyframes score-pop { from { opacity: 0; transform: translate(-50%, -40%) scale(.7); } 25% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -120%) scale(1.1); } }
    @keyframes star-drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(18px, -12px, 0) scale(1.04); } }
    @keyframes orbit-glow { 0%, 100% { opacity: .62; transform: rotate(-25deg) scaleX(1.45) scaleY(1); } 50% { opacity: 1; transform: rotate(-18deg) scaleX(1.52) scaleY(1.06); } }
    @keyframes aim-reveal { from { opacity: 0; letter-spacing: .35em; transform: translateY(18px) scale(.72); filter: blur(10px); } to { opacity: 1; letter-spacing: -.06em; transform: translateY(0) scale(1); filter: blur(0); } }
    @keyframes aim-breathe { 0%, 100% { text-shadow: 0 0 18px rgba(136, 243, 204, .38), 0 0 55px rgba(97, 220, 231, .24); } 50% { text-shadow: 0 0 27px rgba(136, 243, 204, .7), 0 0 80px rgba(97, 220, 231, .42); } }

    @media (max-width: 700px) {
      .scene { padding: 20px; }
      .topbar { padding: 22px 20px; }
      .speed-control { top: 19px; right: 20px; }
      .size-control { top: 85px; right: 20px; }
      .game-timer { top: 22px; left: 20px; }
      .status { font-size: .62rem; }
      .game-message { top: 150px; right: 22px; }
      .intro { top: 98px; left: 22px; right: 22px; }
      h1 { max-width: 290px; font-size: clamp(2.7rem, 13vw, 4rem); }
      .intro-copy { max-width: 300px; margin-top: 16px; font-size: .88rem; }
      .interaction-zone { width: calc(100vw - 40px); height: min(57vh, 500px); min-height: 300px; margin-top: 0; }
      .pulse-button { width: calc(106px * var(--pulse-size)); height: calc(106px * var(--pulse-size)); }
      .counter { right: 25px; bottom: 73px; }
      .counter-value { font-size: 1.7rem; }
      .hint { bottom: 23px; white-space: nowrap; }
      .zone-label { right: 18px; bottom: 17px; font-size: .58rem; }
    }

    @media (max-width: 430px) {
      .speed-control,
      .size-control { right: 14px; transform: scale(.9); transform-origin: top right; }
      .speed-control { top: 16px; }
      .size-control { top: 78px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="start-screen" id="startScreen" aria-label="Inicio del juego">
      <p class="start-kicker">Prueba de precisión</p>
      <h1 class="start-title">AIM</h1>
      <p class="start-copy">Selecciona la velocidad y pulsa START para comenzar una partida de 30 segundos.</p>
      <div class="start-actions">
        <button class="start-button" id="startButton" type="button">Start</button>
        <a class="start-button info-button" href="info.html">Info</a>
      </div>
    </section>

    <div class="speed-control" aria-label="Configurar velocidad">
      <span class="speed-label">Velocidad</span>
      <div class="speed-options" role="group" aria-label="Nivel de velocidad">
        <button class="speed-option" type="button" data-speed="1" aria-label="Velocidad 1, lenta" aria-pressed="true">1</button>
        <button class="speed-option" type="button" data-speed="2" aria-label="Velocidad 2" aria-pressed="false">2</button>
        <button class="speed-option" type="button" data-speed="3" aria-label="Velocidad 3" aria-pressed="false">3</button>
        <button class="speed-option" type="button" data-speed="4" aria-label="Velocidad 4" aria-pressed="false">4</button>
        <button class="speed-option" type="button" data-speed="5" aria-label="Velocidad 5, muy rápida" aria-pressed="false">5</button>
      </div>
    </div>

    <div class="size-control" aria-label="Configurar tamaño">
      <span class="speed-label">Tamaño</span>
      <div class="speed-options" role="group" aria-label="Nivel de tamaño">
        <button class="speed-option size-option" type="button" data-size="1" aria-label="Tamaño 1, actual" aria-pressed="true">1</button>
        <button class="speed-option size-option" type="button" data-size="2" aria-label="Tamaño 2" aria-pressed="false">2</button>
        <button class="speed-option size-option" type="button" data-size="3" aria-label="Tamaño 3" aria-pressed="false">3</button>
        <button class="speed-option size-option" type="button" data-size="4" aria-label="Tamaño 4" aria-pressed="false">4</button>
        <button class="speed-option size-option" type="button" data-size="5" aria-label="Tamaño 5, pequeño" aria-pressed="false">5</button>
      </div>
    </div>

    <section class="interaction-zone" id="interactionZone" aria-label="Área interactiva">
      <button class="pulse-button" type="button" aria-label="Activar objetivo">
        <span class="approach-ring" id="approachRing" aria-hidden="true"></span>
      </button>
      <button class="pulse-button is-hidden" type="button" aria-label="Activar objetivo">
        <span class="approach-ring" aria-hidden="true"></span>
      </button>
      <button class="pulse-button is-hidden" type="button" aria-label="Activar objetivo">
        <span class="approach-ring" aria-hidden="true"></span>
      </button>
    </section>

    <div class="game-timer" aria-live="polite">
      <span class="game-timer-value" id="gameTimerValue">30</span>
      <span class="game-timer-label">Segundos</span>
    </div>

    <div class="counter" aria-live="polite"><span class="counter-value" id="counterValue">00</span></div>
  </main>

  <script>
    const zone = document.querySelector('#interactionZone');
    const buttons = [...document.querySelectorAll('.pulse-button')];
    const counter = document.querySelector('#counterValue');
    const scene = document.querySelector('.scene');
    const startButton = document.querySelector('#startButton');
    const gameTimerValue = document.querySelector('#gameTimerValue');
    const speedOptions = document.querySelectorAll('.speed-control .speed-option');
    const sizeOptions = document.querySelectorAll('.size-option');
    const sizeLevels = { 1: 1, 2: .9, 3: .8, 4: .7, 5: .6 };
    const speedLevels = {
      1: { duration: 2400, cueDuration: 560, precision: 280, spawnDelay: 900 },
      2: { duration: 1800, cueDuration: 440, precision: 220, spawnDelay: 700 },
      3: { duration: 1200, cueDuration: 360, precision: 170, spawnDelay: 500 },
      4: { duration: 800, cueDuration: 280, precision: 120, spawnDelay: 320 },
      5: { duration: 500, cueDuration: 200, precision: 80, spawnDelay: 180 }
    };
    let score = 0;
    let hits = 0;
    let attempts = 0;
    let roundStartedAt = performance.now();
    let gameOver = true;
    let gameStarted = false;
    let timerLeft = 30;
    let gameTimer;
    let startDelayTimer;
    let speedLevel = 1;
    let sizeLevel = 1;
    let spawnTimer;
    let sequenceToken = 0;
    const buttonStates = new Map(buttons.map(button => [button, {
      roundStartedAt: 0,
      roundResolved: true,
      active: false,
      roundTimer: null,
      roundCueTimer: null,
      replacementTimer: null
    }]));

    function showFeedback(button, text, isMiss = false) {
      const feedback = document.createElement('span');
      feedback.className = `score-pop${isMiss ? ' miss' : ''}`;
      feedback.textContent = text;
      feedback.style.left = button.style.getPropertyValue('--button-x');
      feedback.style.top = button.style.getPropertyValue('--button-y');
      zone.append(feedback);
      feedback.addEventListener('animationend', () => feedback.remove(), { once: true });
    }

    function findPulsePosition(button) {
      const padding = Math.min(82, Math.max(button.offsetWidth / 2 + 20, 72));
      const minimumDistance = button.offsetWidth + 38;
      const activeButtons = buttons.filter(other => {
        return other !== button && buttonStates.get(other).active && !other.classList.contains('is-hidden');
      });

      for (let attempt = 0; attempt < 80; attempt += 1) {
        const x = padding + Math.random() * Math.max(zone.clientWidth - padding * 2, 1);
        const y = padding + Math.random() * Math.max(zone.clientHeight - padding * 2, 1);
        const isSeparated = activeButtons.every(other => {
          const otherX = parseFloat(other.style.getPropertyValue('--button-x')) / 100 * zone.clientWidth;
          const otherY = parseFloat(other.style.getPropertyValue('--button-y')) / 100 * zone.clientHeight;
          return Math.hypot(x - otherX, y - otherY) >= minimumDistance;
        });

        if (isSeparated) return { x, y };
      }

      return {
        x: padding + Math.random() * Math.max(zone.clientWidth - padding * 2, 1),
        y: padding + Math.random() * Math.max(zone.clientHeight - padding * 2, 1)
      };
    }

    function placePulse(button) {
      const state = buttonStates.get(button);
      const speed = speedLevels[speedLevel];
      const approachRing = button.querySelector('.approach-ring');
      const { x: nextX, y: nextY } = findPulsePosition(button);
      button.style.setProperty('--button-x', `${(nextX / zone.clientWidth) * 100}%`);
      button.style.setProperty('--button-y', `${(nextY / zone.clientHeight) * 100}%`);
      button.classList.remove('is-hidden');
      button.classList.remove('is-ready');
      approachRing.classList.remove('is-aligned', 'is-missed', 'is-closing');
      void approachRing.offsetWidth;
      clearTimeout(state.roundTimer);
      clearTimeout(state.roundCueTimer);
      state.roundResolved = false;
      state.active = true;
      state.roundStartedAt = performance.now();
      approachRing.style.setProperty('--round-duration', `${speed.duration}ms`);
      button.style.setProperty('--cue-duration', `${speed.cueDuration}ms`);
      approachRing.classList.add('is-closing');
      state.roundCueTimer = setTimeout(() => button.classList.add('is-ready'), speed.duration - speed.cueDuration / 2);
      state.roundTimer = setTimeout(() => resolveRound(button, false), speed.duration + speed.precision + 40);
    }

    function setSpeed(level) {
      speedLevel = level;
      speedOptions.forEach(option => {
        option.setAttribute('aria-pressed', option.dataset.speed === String(level));
      });
      if (gameStarted) return;
    }

    function setSize(level) {
      sizeLevel = level;
      scene.style.setProperty('--pulse-size', sizeLevels[level]);
      sizeOptions.forEach(option => {
        option.setAttribute('aria-pressed', option.dataset.size === String(level));
      });
    }

    function startGame() {
      score = 0;
      hits = 0;
      attempts = 0;
      counter.textContent = '00';
      timerLeft = 30;
      gameTimerValue.textContent = timerLeft;
      gameOver = false;
      gameStarted = true;
      scene.classList.add('is-game-active');
      zone.classList.remove('game-over');
      speedOptions.forEach(option => { option.disabled = true; });
      sizeOptions.forEach(option => { option.disabled = true; });
      startButton.classList.remove('is-launching');
      startButton.disabled = false;
      startButton.textContent = 'Start';
      startButton.removeAttribute('aria-busy');
      clearInterval(gameTimer);
      startSequence();
      gameTimer = setInterval(updateTimer, 1000);
    }

    function finishGame() {
      gameOver = true;
      gameStarted = false;
      clearInterval(gameTimer);
      speedOptions.forEach(option => { option.disabled = false; });
      sizeOptions.forEach(option => { option.disabled = false; });
      buttons.forEach(button => {
        const state = buttonStates.get(button);
        clearTimeout(state.roundTimer);
        clearTimeout(state.roundCueTimer);
        clearTimeout(state.replacementTimer);
        state.active = false;
        button.classList.add('is-hidden');
        button.querySelector('.approach-ring').classList.add('is-missed');
      });
      zone.classList.add('game-over');
      scene.classList.remove('is-game-active');
    }

    function resolveRound(button, isHit) {
      const state = buttonStates.get(button);
      if (gameOver || state.roundResolved) return;
      state.roundResolved = true;
      state.active = false;
      clearTimeout(state.roundTimer);
      clearTimeout(state.roundCueTimer);
      clearTimeout(state.replacementTimer);
      attempts += 1;
      if (isHit) {
        score += 2;
        hits += 1;
        showFeedback(button, '+2');
      } else {
        button.querySelector('.approach-ring').classList.add('is-missed');
      }
      counter.textContent = String(score).padStart(2, '0');
      button.classList.remove('is-ready');
      button.classList.add('is-hidden');
      state.replacementTimer = setTimeout(() => { if (!gameOver) placePulse(button); }, 220);
    }

    function hitPulse(button) {
      const state = buttonStates.get(button);
      if (gameOver || state.roundResolved) return;
      const speed = speedLevels[speedLevel];
      const elapsed = performance.now() - state.roundStartedAt;
      const precision = Math.abs(elapsed - speed.duration);
      const isHit = precision <= speed.precision;
      resolveRound(button, isHit);
    }

    function updateTimer() {
      timerLeft -= 1;
      gameTimerValue.textContent = Math.max(timerLeft, 0);
      if (timerLeft <= 0) finishGame();
    }

    buttons.forEach(button => {
      button.addEventListener('click', () => hitPulse(button));
      button.addEventListener('pointerdown', () => button.classList.add('is-pressed'));
      button.addEventListener('pointerup', () => button.classList.remove('is-pressed'));
      button.addEventListener('pointerleave', () => button.classList.remove('is-pressed'));
    });
    speedOptions.forEach(option => {
      option.addEventListener('click', () => {
        if (!gameStarted) setSpeed(Number(option.dataset.speed));
      });
    });
    sizeOptions.forEach(option => {
      option.addEventListener('click', () => {
        if (!gameStarted) setSize(Number(option.dataset.size));
      });
    });
    startButton.addEventListener('click', () => {
      if (gameStarted || startButton.disabled) return;
      startButton.disabled = true;
      startButton.classList.add('is-launching');
      startButton.textContent = 'Preparando...';
      startButton.setAttribute('aria-busy', 'true');
      speedOptions.forEach(option => { option.disabled = true; });
      sizeOptions.forEach(option => { option.disabled = true; });
      startDelayTimer = setTimeout(startGame, 2500);
    });

    function startSequence() {
      if (gameOver || !gameStarted) return;
      clearTimeout(spawnTimer);
      sequenceToken += 1;
      const currentToken = sequenceToken;

      buttons.forEach(button => {
        const state = buttonStates.get(button);
        clearTimeout(state.roundTimer);
        clearTimeout(state.roundCueTimer);
        clearTimeout(state.replacementTimer);
        state.active = false;
        state.roundResolved = true;
        button.classList.remove('is-ready');
        button.classList.add('is-hidden');
        button.querySelector('.approach-ring').classList.remove('is-closing', 'is-missed');
      });

      function spawnNext(index) {
        if (gameOver || currentToken !== sequenceToken || index >= buttons.length) return;
        placePulse(buttons[index]);
        if (index < buttons.length - 1) {
          spawnTimer = setTimeout(() => spawnNext(index + 1), speedLevels[speedLevel].spawnDelay);
        }
      }

      spawnNext(0);
    }

  </script>
</body>
</html>
